name: deploy-github-pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: "get code"
        uses: actions/checkout@v4

      - name: "install nodejs"
        uses: actions/setup-node@v7

      - name: "install dependencies"
        run: npm install

      - name: "build"
        run: npm run build

      - name: Create CNAME
        run: echo "portfolio.luffes.dev" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

